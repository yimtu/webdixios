name: S00 Lockfile Build

on:
  push:
    branches: ["loop/S00-hero"]

permissions:
  contents: write

jobs:
  lockfile-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: loop/S00-hero

      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Confirm toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
          node --version
          npm --version

      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate frozen install
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build candidate
        run: npm run build

      - name: Audit frozen tree
        run: npm audit --audit-level=high

      - name: Commit validated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/s00-lockfile-build.yml
          git commit -m "loop(S00): repair attempt 01 reproducible install"
          git push origin HEAD:loop/S00-hero
